services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darwin-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-darwin-admin}
    volumes:
      - darwin_templates:/app/app/templates
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darwin-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  darwin_templates:
