services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darwin-backend
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darwin-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
